name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Build extension
        run: npm run build:extension

      - name: Package zip
        run: cd dist && zip -r "../clousight-extension-${{ github.ref_name }}.zip" . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: clousight-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
